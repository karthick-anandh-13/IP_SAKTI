services:
  postgres:
    image: postgres:16-alpine
    container_name: ipsakti_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ipsakti
      POSTGRES_PASSWORD: ipsakti_pass
      POSTGRES_DB: ipsakti_db
    ports:
      - "5432:5432"
    volumes:
      - ipsakti_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipsakti -d ipsakti_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipsakti_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://ipsakti:ipsakti_pass@postgres:5432/ipsakti_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION_super_secret_key}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      # The RAG/LLM inference service is expected to run separately (outside
      # this compose file). host.docker.internal lets the backend container
      # reach a RAG service running on the host machine at port 8000.
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-http://host.docker.internal:8000/query}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ipsakti_pg_data:
